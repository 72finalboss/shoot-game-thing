<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Ops 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Menu -->
    <div id="main-menu">
        <h1 class="pf-title">TACTICAL OPS</h1>
        <button id="btn-play" class="menu-btn">DEPLOY</button>
        <button id="btn-loadout" class="menu-btn">LOADOUT</button>
        <button id="btn-settings-menu" class="menu-btn">SETTINGS</button>
    </div>

    <!-- Loadout Screen -->
    <div id="loadout-screen" class="hidden">
        <div class="loadout-left">
            <h2 class="section-title">WEAPON LOADOUT</h2>
            
            <div class="weapon-selectors">
                <button class="weapon-select-btn active" data-weapon="m4a1">M4A1</button>
                <button class="weapon-select-btn" data-weapon="AWP">AWP</button>
                <button class="weapon-select-btn" data-weapon="mp5">MP5</button>
            </div>

            <div class="attachment-selectors">
                <div class="select-group">
                    <label>OPTIC</label>
                    <select id="optic-select">
                        <option value="iron">Iron Sights</option>
                        <option value="reddot">Red Dot Sight</option>
                        <option value="acog">ACOG 4x Scope</option>
                        <option value="sniper">8x Sniper Scope</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>MUZZLE</label>
                    <select id="muzzle-select">
                        <option value="none">Standard Flash Hider</option>
                        <option value="suppressor">Tactical Suppressor</option>
                        <option value="compensator">Recoil Compensator</option>
                        <option value="brake">Heavy Muzzle Brake</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>STOCK</label>
                    <select id="stock-select">
                        <option value="standard">Standard Stock</option>
                        <option value="skeletal">Skeletal Minimalist</option>
                        <option value="heavy">Heavy Sniper Stock</option>
                        <option value="folded">CQB Folded</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>MAGAZINE</label>
                    <select id="mag-select">
                        <option value="standard">Standard Mag</option>
                        <option value="extended">Extended Mag (+50%)</option>
                        <option value="drum">Drum Mag (+100%)</option>
                    </select>
                </div>
                <div class="select-group">
                    <label>GRIP</label>
                    <select id="handle-select">
                        <option value="none">None</option>
                        <option value="vertical">Vertical Foregrip</option>
                        <option value="angled">Angled Grip</option>
                        <option value="stubby">Stubby Grip</option>
                    </select>
                </div>
            </div>

            <button id="btn-back-loadout" class="menu-btn small">BACK</button>
        </div>
        <div class="loadout-right">
            <div id="loadout-viewer"></div>
        </div>
    </div>

    <!-- Settings Screen -->
    <div id="settings-screen" class="hidden">
        <div class="settings-panel">
            <h2 class="section-title">SETTINGS</h2>
            <div class="setting-row">
                <label>FIELD OF VIEW</label>
                <div class="setting-control">
                    <input type="range" id="setting-fov" min="60" max="110" value="78">
                    <span id="val-setting-fov">78°</span>
                </div>
            </div>
            <div class="setting-row">
                <label>MASTER VOLUME</label>
                <div class="setting-control">
                    <input type="range" id="setting-volume" min="0" max="100" value="100">
                    <span id="val-setting-volume">100%</span>
                </div>
            </div>
            <div class="setting-row">
                <label>MOUSE SENSITIVITY</label>
                <div class="setting-control">
                    <input type="range" id="setting-sens" min="0.1" max="3.0" step="0.05" value="1.0">
                    <span id="val-setting-sens">1.00x</span>
                </div>
            </div>
            <button id="btn-back-settings" class="menu-btn small">BACK</button>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="hud" class="hidden">
        <div id="crosshair">
            <div id="ch-top" class="ch-line" style="width: 2px; height: 12px; left: 50%; top: 0; transform: translate(-50%, -8px);"></div>
            <div id="ch-bottom" class="ch-line" style="width: 2px; height: 12px; left: 50%; bottom: 0; transform: translate(-50%, 8px);"></div>
            <div id="ch-left" class="ch-line" style="width: 12px; height: 2px; top: 50%; left: 0; transform: translate(-8px, -50%);"></div>
            <div id="ch-right" class="ch-line" style="width: 12px; height: 2px; top: 50%; right: 0; transform: translate(8px, -50%);"></div>
        </div>
        <div id="hitmarker">
            <div class="hitmark-line" style="width: 12px; height: 2px; top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
            <div class="hitmark-line" style="width: 2px; height: 12px; top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
        </div>
        <div id="sniper-scope">
            <div class="scope-lens">
                <div class="scope-ch scope-ch-h"></div>
                <div class="scope-ch scope-ch-v"></div>
                <div class="scope-dots scope-dots-h"></div>
                <div class="scope-dots scope-dots-v"></div>
            </div>
        </div>
        <div id="popups-container"></div>
        
        <div class="hud-bottom-left">
            <div class="hp-container">
                <div class="hp-bar-bg"><div id="hp-bar" class="hp-bar-fill" style="width: 100%;"></div></div>
                <span id="hp-text">100 HP</span>
            </div>
            <div class="stance-indicator" id="stance-indicator">STAND</div>
        </div>
        
        <div class="hud-bottom-right">
            <div class="ammo-display">
                <span id="ammo-clip">30</span> / <span id="ammo-reserve">120</span>
            </div>
            <div class="weapon-name-hud" id="weapon-name-hud">M4A1 ASSAULT RIFLE</div>
            <div class="firemode-hud" id="firemode-hud">AUTO</div>
        </div>

        <div class="hud-top-right">
            <div class="score-display">
                <span class="team-phantoms">PHANTOMS: <span id="score-phantoms">150</span></span>
                <span class="team-ghosts">GHOSTS: <span id="score-ghosts">135</span></span>
            </div>
            <div class="kd-display" id="kd-display">0 / 0</div>
        </div>

        <div id="kill-notify" class="kill-notify"></div>
        <div id="kill-feed" class="kill-feed"></div>
    </div>

    <!-- Respawn Screen -->
    <div id="respawn-screen" class="hidden">
        <div class="respawn-panel">
            <h2 class="pf-title">ELIMINATED</h2>
            <p>Respawning in <span id="respawn-timer">5</span>s</p>
            <button id="respawn-deploy-btn" class="menu-btn">DEPLOY NOW</button>
        </div>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard" class="hidden">
        <div class="lb-panel">
            <h3>SCOREBOARD</h3>
            <div class="lb-teams">
                <span class="team-phantoms">PHANTOMS: <span id="lb-team-phantoms">150</span></span>
                <span class="team-ghosts">GHOSTS: <span id="lb-team-ghosts">135</span></span>
            </div>
            <table class="lb-table">
                <thead>
                    <tr><th>#</th><th>PLAYER</th><th>TEAM</th><th>K</th><th>D</th><th>K/D</th><th>SCORE</th></tr>
                </thead>
                <tbody id="lb-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Hit Flash -->
    <div id="hit-flash" class="hit-flash"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="gunsLoad.js"></script>
    <script src="game.js"></script>
</body>
</html>
